    <script>
    (function(){
      const allowed = new Set(['www.prudle-education.com','prudle-education.com','abbassaboali-alt.github.io']);
      window.addEventListener('keydown', function(e){
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
          e.preventDefault();
        }
      }, true);
      const host = window.location.hostname.toLowerCase();
      const isDevOrPreview = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.run.app');
      if (!isDevOrPreview && (window.location.protocol !== 'https:' || !allowed.has(host))) {
        window.stop();
        window.location.replace('https://www.prudle-education.com/log-in-out');
      }
    })();
    </script>
