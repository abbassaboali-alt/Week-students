      (function () {
        var isDev =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname.endsWith('.run.app') ||
          location.hostname.endsWith('.aistudio.google.com');

        window.addEventListener(
          'keydown',
          function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
              e.preventDefault();
            }
          },
          true
        );

        if (!isDev) {
          var allowed = new Set([
            'www.prudle-education.com',
            'prudle-education.com',
            'abbassaboali-alt.github.io',
          ]);
          if (
            location.protocol !== 'https:' ||
            !allowed.has(location.hostname.toLowerCase())
          ) {
            window.stop();
            location.replace('https://www.prudle-education.com/log-in-out');
          }
        }
      })();
    </script>
